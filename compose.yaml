name: fairspace
services:
  db:
    image: postgres:17-alpine
    ports: ["127.0.0.1:5433:5432"] # 5432 is often taken by other local projects
    environment:
      POSTGRES_USER: fairspace
      POSTGRES_PASSWORD: fairspace
      POSTGRES_DB: fairspace
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U fairspace"]
      interval: 2s
      timeout: 3s
      retries: 15
  # Local inbox for magic-link emails: SMTP on 1025, web UI and API on http://localhost:8025.
  mailpit:
    image: axllent/mailpit
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
volumes:
  pgdata:
