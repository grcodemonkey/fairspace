name: fairspace
services:
  db:
    image: postgres:17-alpine
    ports: ["5433:5432"] # 5432 is often taken by other local projects
    environment:
      POSTGRES_USER: fairspace
      POSTGRES_PASSWORD: fairspace
      POSTGRES_DB: fairspace
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fairspace"]
      interval: 2s
      timeout: 3s
      retries: 15
volumes:
  pgdata:
