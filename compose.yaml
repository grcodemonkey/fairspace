name: fairspace
services:
  db:
    image: postgres:17-alpine
    ports: ["127.0.0.1:5433:5432"] # 5432 is often taken by other local projects
    environment:
      POSTGRES_USER: fairspace
      POSTGRES_PASSWORD: fairspace
      POSTGRES_DB: fairspace
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U fairspace"]
      interval: 2s
      timeout: 3s
      retries: 15
  # Local inbox for magic-link emails: SMTP on 1025, web UI and API on http://localhost:8025.
  mailpit:
    image: axllent/mailpit
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
  # Local S3-compatible storage for media uploads (S3 API on http://localhost:8333). The image runs `weed mini`.
  storage:
    image: chrislusf/seaweedfs:4.55
    ports: ["127.0.0.1:8333:8333"]
    environment:
      AWS_ACCESS_KEY_ID: fairspace
      AWS_SECRET_ACCESS_KEY: fairspace
      S3_BUCKET: fairspace
    volumes:
      - storagedata:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  pgdata:
  storagedata:
