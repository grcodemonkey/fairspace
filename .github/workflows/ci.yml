name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEST_DATABASE_URL: postgres://fairspace:fairspace@localhost:5433/fairspace_test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fairspace
          POSTGRES_PASSWORD: fairspace
          # Service containers cannot run db/init, so create the test database directly.
          POSTGRES_DB: fairspace_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U fairspace"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
      # Inbox for the magic-link e2e test.
      mailpit:
        image: axllent/mailpit
        ports: ["1025:1025", "8025:8025"]
      # S3-compatible storage for media uploads. The image runs `weed mini`; the test setup creates the bucket.
      storage:
        image: chrislusf/seaweedfs:4.55
        env:
          AWS_ACCESS_KEY_ID: fairspace
          AWS_SECRET_ACCESS_KEY: fairspace
          S3_BUCKET: fairspace-test
        ports: ["8333:8333"]
        options: >-
          --health-cmd "wget -q -O /dev/null http://127.0.0.1:8333/healthz"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # No DATABASE_URL or AUTH_SECRET here: proves the build needs no secrets. e2e then runs `pnpm start`.
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
