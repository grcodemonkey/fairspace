name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEST_DATABASE_URL: postgres://fairspace:fairspace@localhost:5433/fairspace_test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fairspace
          POSTGRES_PASSWORD: fairspace
          # Service containers cannot run db/init, so create the test database directly.
          POSTGRES_DB: fairspace_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U fairspace"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
